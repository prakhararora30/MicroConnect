<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Connect</title>
  <meta name="description" content="Login to your Connect account to stay connected.">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
  <!-- Canvas for Constellation Background -->
  <canvas id="particle-canvas"></canvas>

  <!-- Right Split Backdrop Overlay -->
  <div class="right-split-backdrop"></div>

  <!-- Navigation Back Link -->
  <a href="index.html" class="back-link" aria-label="Go Back">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    <span>Back</span>
  </a>

  <!-- Main Login Layout Container -->
  <main class="login-selection-container">
    <!-- Left Hero Text -->
    <div class="login-hero-left">
      <h1 class="login-main-title">Welcome Back!</h1>
      <p class="login-main-subtitle">Login to your account</p>
    </div>

    <!-- Right Login Card -->
    <div class="login-card-wrapper">
      <div class="login-card-outer">
        <div class="login-card">
          <!-- Error Notification Alert Box -->
          <div id="auth-error-msg" class="auth-error-banner hidden"></div>

          <form id="login-form" class="login-form">
            <!-- Email Input Field -->
            <div class="form-group">
              <label for="login-email" class="form-label">Email</label>
              <input 
                type="email" 
                id="login-email" 
                class="form-input" 
                placeholder="Email" 
                required 
              />
            </div>

            <!-- Password Input Field with Toggle -->
            <div class="form-group">
              <label for="login-password" class="form-label">Password</label>
              <div class="password-input-wrapper">
                <input 
                  type="password" 
                  id="login-password" 
                  class="form-input password-field" 
                  placeholder="••••••••" 
                  required 
                />
                <button type="button" id="toggle-password" class="toggle-password-btn" aria-label="Toggle password visibility">
                  <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                  </svg>
                </button>
              </div>
              <div style="text-align: right; margin-top: 0.5rem;">
                <a href="#" id="forgot-password-link" style="color: #e53012; text-decoration: none; font-size: 0.92rem; font-weight: 600;">Forgot Password?</a>
              </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="login-submit-btn" class="btn-primary full-width login-btn-text">
              LOGIN
            </button>

            <!-- Register Link Prompt -->
            <p class="register-prompt">
              Don't have an account? <a href="get-started.html" class="register-link">REGISTER</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
  
  <!-- Firebase Login Integration Module -->
  <script type="module">
    import { auth, signInWithEmailAndPassword, onAuthStateChanged, sendPasswordResetEmail } from './firebase-config.js';

    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('login-form');
      const emailInput = document.getElementById('login-email');
      const passwordInput = document.getElementById('login-password');
      const submitBtn = document.getElementById('login-submit-btn');
      const errorBanner = document.getElementById('auth-error-msg');
      const toggleBtn = document.getElementById('toggle-password');
      const eyeIcon = document.getElementById('eye-icon');
      const forgotPasswordLink = document.getElementById('forgot-password-link');

      // Password Eye Toggle
      const eyeOpenSvg = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
      const eyeSlashSvg = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;

      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        eyeIcon.innerHTML = isPassword ? eyeOpenSvg : eyeSlashSvg;
      });

      // Redirect if already logged in
      onAuthStateChanged(auth, (user) => {
        if (user) {
          window.location.href = 'dashboard.html';
        }
      });

      // Handle Forgot Password
      forgotPasswordLink.addEventListener('click', async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        
        if (!email) {
          errorBanner.textContent = 'Please enter your email address above to reset your password.';
          errorBanner.style.backgroundColor = ''; 
          errorBanner.classList.remove('hidden');
          return;
        }

        try {
          await sendPasswordResetEmail(auth, email);
          errorBanner.textContent = 'Password reset email sent! Please check your inbox.';
          errorBanner.style.backgroundColor = '#10b981'; // Success Green
          errorBanner.style.color = '#ffffff';
          errorBanner.classList.remove('hidden');
        } catch (error) {
          errorBanner.textContent = getFriendlyErrorMessage(error.code);
          errorBanner.style.backgroundColor = ''; // Reset to default error red
          errorBanner.classList.remove('hidden');
        }
      });

      // Handle Firebase Sign In
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBanner.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.textContent = 'LOGGING IN...';

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        try {
          // Attempt Firebase Auth sign-in
          await signInWithEmailAndPassword(auth, email, password);
          window.location.href = 'dashboard.html';
        } catch (error) {
          console.error('Firebase Auth Error:', error);
          errorBanner.textContent = getFriendlyErrorMessage(error.code);
          errorBanner.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.textContent = 'LOGIN';
        }
      });

      function getFriendlyErrorMessage(code) {
        switch (code) {
          case 'auth/user-not-found':
          case 'auth/wrong-password':
          case 'auth/invalid-credential':
            return 'Invalid email or password. Please try again.';
          case 'auth/invalid-email':
            return 'Please enter a valid email address.';
          case 'auth/too-many-requests':
            return 'Too many failed attempts. Please reset password or try later.';
          default:
            return 'Failed to login. Please verify your Firebase Config or network connection.';
        }
      }
    });
  </script>
</body>
</html>
