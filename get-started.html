<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Started - Choose Your Role | Connect</title>
  <meta name="description" content="Choose your role to get started on Connect as an Alumni or Student.">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="theme.js"></script>
</head>
<body>
  <!-- Canvas for Constellation Background -->
  <canvas id="particle-canvas"></canvas>

  <!-- Navigation Back Button -->
  <a href="index.html" class="back-link" aria-label="Go Back">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    <span>Back</span>
  </a>

  <!-- Role Selection Split Container -->
  <main class="role-selection-container">
    <!-- Left Hero Text -->
    <div class="role-hero-left">
      <h1 class="role-main-title">Get Started!</h1>
      <p class="role-main-subtitle">Who are you joining as?</p>
    </div>

    <!-- Right Selection Card -->
    <div class="role-card-wrapper">
      <div class="role-card">
        <h2 class="card-title">Choose your role</h2>

        <!-- Error Alert Banner -->
        <div id="reg-error-msg" class="auth-error-banner hidden"></div>

        <form id="register-role-form">
          <div class="form-group" style="margin-bottom: 1.2rem;">
            <label for="reg-name" class="form-label">Full Name</label>
            <input type="text" id="reg-name" class="form-input" placeholder="e.g. Alex Morgan" required />
          </div>

          <div class="form-group" style="margin-bottom: 1.2rem;">
            <label for="reg-email" class="form-label">Email Address</label>
            <input type="email" id="reg-email" class="form-input" placeholder="alex@example.com" required />
          </div>

          <div class="form-group" style="margin-bottom: 1.5rem;">
            <label for="reg-pass" class="form-label">Password</label>
            <input type="password" id="reg-pass" class="form-input" placeholder="••••••••" required minlength="6" />
          </div>

          <div class="form-group" style="margin-bottom: 1.2rem;">
            <label class="form-label">Profile Photo (Avatar) - Optional</label>
            <input type="file" id="reg-profile-photo" class="form-input" accept="image/*" style="padding: 0.5rem;" />
          </div>

          <div class="form-group" style="margin-bottom: 1.5rem;">
            <label class="form-label">ID Card (Photo) - Required</label>
            <input type="file" id="reg-id-photo" class="form-input" accept="image/*" required style="padding: 0.5rem;" />
          </div>

          <div class="role-options-group">
            <!-- Alumni Option -->
            <div class="role-option selected" id="role-alumni" data-role="Alumni" tabindex="0" role="radio" aria-checked="true">
              <div class="role-icon-box alumni-bg">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="38" height="38">
                  <polygon points="32,12 56,24 32,36 8,24" fill="#2c2825" />
                  <path d="M16 31.5 V 45 C 16 52, 48 52, 48 45 V 31.5" fill="none" stroke="#221c1a" stroke-width="6" stroke-linecap="round" />
                  <circle cx="32" cy="24" r="2.5" fill="#f5aa38" />
                  <path d="M32 24 C 42 26, 47 32, 47 40" fill="none" stroke="#f5aa38" stroke-width="2.5" stroke-linecap="round" />
                  <polygon points="44,39 50,39 47,48" fill="#f5aa38" />
                </svg>
              </div>
              <span class="role-label">Start as an Alumni</span>
              <div class="check-badge">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </div>
            </div>

            <!-- Student Option -->
            <div class="role-option" id="role-student" data-role="Student" tabindex="0" role="radio" aria-checked="false">
              <div class="role-icon-box student-bg">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="38" height="38">
                  <rect x="12" y="44" width="40" height="10" rx="3" fill="#3b82f6" />
                  <rect x="10" y="32" width="40" height="10" rx="3" fill="#10b981" />
                  <rect x="14" y="20" width="38" height="10" rx="3" fill="#ef4444" />
                </svg>
              </div>
              <span class="role-label">Start as a Student</span>
              <div class="check-badge hidden">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </div>
            </div>
          </div>

          <button type="submit" id="submit-role-btn" class="btn-primary full-width">Get Started</button>
        </form>
      </div>
    </div>
  </main>

  <script src="script.js"></script>

  <!-- Firebase Registration & Profile Creation Script -->
  <script type="module">
    import { 
      auth, 
      db, 
      createUserWithEmailAndPassword, 
      doc, 
      setDoc, 
      serverTimestamp, 
      updateProfile 
    } from './firebase-config.js';

    document.addEventListener('DOMContentLoaded', () => {
      const roleOptions = document.querySelectorAll('.role-option');
      const registerForm = document.getElementById('register-role-form');
      const submitBtn = document.getElementById('submit-role-btn');
      const errorBanner = document.getElementById('reg-error-msg');
      let selectedRole = 'Alumni';

      // Role Selection UI State
      roleOptions.forEach(option => {
        option.addEventListener('click', () => {
          roleOptions.forEach(opt => {
            opt.classList.remove('selected');
            opt.setAttribute('aria-checked', 'false');
            const badge = opt.querySelector('.check-badge');
            if (badge) badge.classList.add('hidden');
          });

          option.classList.add('selected');
          option.setAttribute('aria-checked', 'true');
          const badge = option.querySelector('.check-badge');
          if (badge) badge.classList.remove('hidden');

          selectedRole = option.dataset.role;
        });
      });

      // Helper to compress image and convert to raw base64
      const fileToBase64 = (file) => {
        return new Promise((resolve, reject) => {
          if (!file) {
            resolve('');
            return;
          }
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
              const canvas = document.createElement('canvas');
              let width = img.width;
              let height = img.height;
              const MAX_DIM = 600;
              
              if (width > height && width > MAX_DIM) {
                height *= MAX_DIM / width;
                width = MAX_DIM;
              } else if (height > MAX_DIM) {
                width *= MAX_DIM / height;
                height = MAX_DIM;
              }
              
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              
              const dataUrl = canvas.toDataURL('image/jpeg', 0.6); // Compress to 60% quality JPEG
              const rawBase64 = dataUrl.includes(',') ? dataUrl.split(',')[1] : dataUrl;
              resolve(rawBase64);
            };
            img.onerror = () => reject(new Error('Failed to load image'));
          };
          reader.onerror = error => reject(error);
        });
      };

      // Firebase User Registration & Firestore Document Creation
      registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBanner.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.textContent = 'CREATING ACCOUNT...';

        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-pass').value;
        const profilePhotoFile = document.getElementById('reg-profile-photo').files[0];
        const idPhotoFile = document.getElementById('reg-id-photo').files[0];

        try {
          // Convert images to base64 to match mobile app behavior
          const profilePhotoBase64 = await fileToBase64(profilePhotoFile);
          const idPhotoBase64 = await fileToBase64(idPhotoFile);

          // 1. Create Firebase Auth user
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;

          // 2. Update Auth Display Name
          await updateProfile(user, {
            displayName: name
          });

          // 3. Write user details to Firestore document based on role (Matching Mobile App Schema)
          const collectionName = selectedRole === 'Alumni' ? 'alumni' : 'students';
          await setDoc(doc(db, collectionName, user.uid), {
            bio: "",
            createdAt: new Date().getTime(),
            education: "",
            email: email,
            experience: "",
            fcmToken: "",
            fullName: name,
            idPhotoBase64: idPhotoBase64,
            location: "",
            points: 350,
            profilePhotoBase64: profilePhotoBase64,
            role: selectedRole,
            skills: "",
            uid: user.uid
          });

          // 4. Redirect to Feed Dashboard
          window.location.href = 'dashboard.html';
        } catch (error) {
          console.error('Registration Error:', error);
          errorBanner.textContent = getFriendlyErrorMessage(error.code);
          errorBanner.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Get Started';
        }
      });

      function getFriendlyErrorMessage(code) {
        switch (code) {
          case 'auth/email-already-in-use':
            return 'This email address is already registered. Please login instead.';
          case 'auth/invalid-email':
            return 'Please enter a valid email address.';
          case 'auth/weak-password':
            return 'Password should be at least 6 characters.';
          default:
            return 'Failed to create account. Check your Firebase Config connection.';
        }
      }
    });
  </script>
</body>
</html>
